name: Feature request
description: Propose a focused workflow or safety improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which operator or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the safe default and human-override path.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and alternatives
      description: Consider provider cost, duplicate publishing, privacy, copyright and platform policy.
